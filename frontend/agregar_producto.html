<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar producto - Sistema de Inventario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="encabezado">
        <h1>Sistema de Inventario</h1>

        <nav class="navegacion">
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="categorias.html">Categorías</a>
            <a href="agregar_producto.html">Agregar producto</a>
        </nav>
    </header>

    <main class="contenido-principal">

        <section class="seccion-pagina">

            <h2>Agregar nuevo producto</h2>

            <p class="descripcion">
                Ingresa la información del nuevo producto que deseas incorporar
                al inventario.
            </p>

            <form id="formulario-producto" class="formulario">

                <div class="campo-formulario">
                    <label for="nombre">
                        Nombre del producto
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ejemplo: Alcohol Gel 1 Litro"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="stock">
                        Stock disponible
                    </label>

                    <input
                        type="number"
                        id="stock"
                        name="stock"
                        min="0"
                        placeholder="Ejemplo: 10"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="categoria">
                        Categoría
                    </label>

                    <select
                        id="categoria"
                        name="categoria"
                        required
                    >
                        <option value="">
                            Cargando categorías...
                        </option>
                    </select>
                </div>

                <button type="submit" class="boton">
                    Guardar producto
                </button>

            </form>

            <p id="mensaje" class="mensaje"></p>

        </section>

    </main>

    <footer>
        <p>Sistema de Inventario - Proyecto Full Stack</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
